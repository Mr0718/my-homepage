    font-size:clamp(30px,5vw,44px);font-weight:500;letter-spacing:.08em;
    line-height:1.3;color:#331d22;
    text-shadow:0 1px 3px rgba(255,252,249,.9),0 0 26px rgba(255,250,246,1),0 0 46px rgba(255,250,246,.85);
  }
  .hero-text .en{
    display:block;font-family:Georgia,serif;font-size:12px;
    letter-spacing:.42em;text-transform:uppercase;color:#9c6a70;margin-top:10px;
    text-shadow:0 0 14px rgba(255,250,246,.95);
  }

  /* ---------- 正文 ---------- */
  section{padding:62px 0}
  .label{
    display:flex;align-items:center;gap:12px;
    font-family:Georgia,serif;font-size:11.5px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--rose);margin-bottom:22px;
  }
  .label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .intro{font-size:clamp(16px,2.1vw,18.5px);color:#4a3f3c;max-width:640px}
  .intro p+p{margin-top:20px}
  .intro em{
    font-style:normal;color:var(--rose);
    box-shadow:inset 0 -0.42em 0 rgba(232,180,184,.42);
  }

  .facts{
    display:grid;grid-template-columns:repeat(3,1fr);
    background:var(--paper);border:1px solid var(--line);border-radius:4px;
    box-shadow:var(--shadow);overflow:hidden;margin-top:34px;
  }
  .fact{padding:26px 24px;text-align:center;position:relative}
  .fact+.fact::before{
    content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;
    background:var(--line);
  }
  .fact .k{font-size:11.5px;letter-spacing:.2em;color:#b0968f;margin-bottom:8px}
  .fact .v{font-size:16px;letter-spacing:.03em;color:#3a2c2b}

  .edu{position:relative;padding-left:30px}
  .edu::before{
    content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;
    background:linear-gradient(180deg,var(--rose-soft),rgba(232,180,184,0));
  }
  .edu-item{position:relative;padding-bottom:30px}
  .edu-item:last-child{padding-bottom:0}
  .edu-item::before{
    content:"";position:absolute;left:-29px;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--rose);
  }
  .edu-date{font-family:Georgia,serif;font-size:12.5px;letter-spacing:.14em;color:var(--rose);margin-bottom:4px}
  .edu-title{font-size:17px;letter-spacing:.03em;color:#3a2c2b}
  .edu-meta{font-size:14px;color:var(--ink2);margin-top:2px}

  .note{
    background:var(--paper);border:1px solid var(--line);border-radius:4px;
    padding:52px 40px;text-align:center;box-shadow:var(--shadow);position:relative;
  }
  .note::before{
    content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);
    width:52px;height:2px;background:var(--rose-soft);
  }
  .note p{color:var(--ink2);font-size:15px;margin-bottom:26px}
  .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .link{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 26px;border-radius:2px;text-decoration:none;
    font-family:Georgia,"PingFang SC",serif;font-size:15px;letter-spacing:.02em;
    transition:all .28s ease;border:1px solid var(--rose);color:var(--rose);
    background:transparent;
  }
  .link:hover{background:var(--rose);color:#fff;transform:translateY(-2px)}
  .link.solid{background:var(--rose);color:#fff;border-color:var(--rose)}
  .link.solid:hover{background:#9c3448;border-color:#9c3448}
  .link svg{width:17px;height:17px;flex:0 0 auto;transition:transform .28s ease}
  .link:hover svg{transform:scale(1.08)}

  footer{
    padding:40px 0 56px;text-align:center;
    font-size:12.5px;color:#b0968f;letter-spacing:.08em;
  }

  .js .rise{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1)}
  .js .rise.in{opacity:1;transform:none}

  @media (max-width:700px){
    .hero{height:56vh;min-height:360px}
    .hero::after{
      background:
        linear-gradient(0deg,rgba(253,248,244,1) 0%,rgba(253,248,244,.9) 16%,rgba(253,248,244,.45) 32%,rgba(253,248,244,0) 52%),
        linear-gradient(180deg,rgba(253,248,244,.96) 0%,rgba(253,248,244,.55) 18%,rgba(253,248,244,.12) 38%,rgba(253,248,244,0) 52%);
    }
    .hero-inner{padding-bottom:26px}
    .hero-row{gap:14px;flex-direction:column;text-align:center;align-items:center}
    .avatar{width:78px;height:78px}
    .hero-text h1{font-size:28px;letter-spacing:.05em}
    section{padding:46px 0}
    .facts{grid-template-columns:1fr}
    .fact+.fact::before{left:18%;right:18%;top:0;bottom:auto;width:auto;height:1px}
    .note{padding:40px 22px}
    .wrap{padding:0 22px}
  }
  @media (prefers-reduced-motion:reduce){
    .hero-photo{animation:none}
    .rise{opacity:1;transform:none;transition:none}
  }
</style>
</head>

      items.forEach(function (el) { el.classList.add('in'); });

    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    items.forEach(function (el) { io.observe(el); });

    }, 1600);
  })();
